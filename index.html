const COLORS=['#0ca58b','#5792d6','#c48a5e','#a47bca','#e2a85e','#7b9f98'];
const today=()=>dateISO(new Date());
function dateISO(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${da}`}
function parseDate(s){if(!s)return new Date();const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}
function addDays(s,n){const d=parseDate(s);d.setDate(d.getDate()+n);return dateISO(d)}
function monday(s){const d=parseDate(s),offset=(d.getDay()+6)%7;d.setDate(d.getDate()-offset);return dateISO(d)}
function monthLabel(s){return parseDate(s).toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}
function formatDate(s,year=false){return s?parseDate(s).toLocaleDateString('ru-RU',year?{day:'numeric',month:'short',year:'numeric'}:{day:'numeric',month:'short'}):'N/A'}
function formatDateTime(s){return s?new Date(s).toLocaleString('ru-RU',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'N/A'}
function hours(n){return n==null?'N/A':`${Number(n).toLocaleString('ru-RU',{maximumFractionDigits:1})} ч`}
function n(v){return v==null||String(v).trim()===''?'N/A':v}
const uid=()=>`${Date.now().toString(36)}${Math.random().toString(36).slice(2,8)}`;
const initial=()=>({version:1,projects:[{id:'qazline',name:'Qazline',color:'#0ca58b',createdAt:new Date().toISOString()},{id:'skvoznyak',name:'SKVOZNYAK',color:'#5792d6',createdAt:new Date().toISOString()},{id:'sixwings',name:'6wings',color:'#c48a5e',createdAt:new Date().toISOString()}],tasks:[],events:[],decisions:[],capacity:{},baselines:{},selectedProject:'qazline'});
function load(){try{const raw=localStorage.getItem(STORE_KEY);if(!raw)return initial();const o=JSON.parse(raw);if(!Array.isArray(o.tasks)||!Array.isArray(o.projects))throw Error('schema');return {...initial(),...o,events:o.events||[],decisions:o.decisions||[],capacity:o.capacity||{},baselines:o.baselines||{}}}catch(e){return initial()}}
let data=load(),view='dashboard',weekAnchor=monday(today()),calendarAnchor=today(),searchText='',ownerFilter='',sortMode='priority';
const project=()=>data.projects.find(p=>p.id===data.selectedProject)||data.projects[0];
const projectName=(id)=>data.projects.find(p=>p.id===id)?.name||'Неизвестный проект';
const scoped=()=>data.tasks.filter(t=>t.projectId===data.selectedProject);
const capacityKey=(wk=weekAnchor,pid=data.selectedProject)=>`${pid}:${wk}`;
const getCapacity=(wk=weekAnchor,pid=data.selectedProject)=>data.capacity[capacityKey(wk,pid)]==null?null:Number(data.capacity[capacityKey(wk,pid)]);
const isDone=t=>t.status==='done';
const hasBlocker=t=>Boolean(t.blocker&&t.blocker.trim());
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clean(s){return String(s||'').trim()}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(data))}catch(e){toast('Ошибка сохранения: проверьте свободное место в браузере.')}}
function log(action,t,details='',reason=''){data.events.unshift({id:uid(),at:new Date().toISOString(),projectId:t.projectId,taskId:t.id,action,details,reason});if(data.events.length>1500)data.events.length=1500}
function update(){save();render()}
function toast(msg){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>root.innerHTML='',3200)}
function setView(v){view=v;searchText='';document.getElementById('sidebar').classList.remove('open');render();window.scrollTo({top:0,behavior:'smooth'})}
function weekEnd(wk){return addDays(wk,6)}
function dueInWeek(t,wk){return Boolean(t.dueDate&&t.dueDate>=wk&&t.dueDate<=weekEnd(wk))}
function planTasks(wk=weekAnchor){return scoped().filter(t=>t.planWeek===wk)}
function calc(wk=weekAnchor){const all=planTasks(wk),est=all.reduce((s,t)=>s+Number(t.estimateHours||0),0),actual=all.reduce((s,t)=>s+Number(t.actualHours||0),0),done=all.filter(isDone),doneEst=done.reduce((s,t)=>s+Number(t.estimateHours||0),0),cap=getCapacity(wk);return {all,est,actual,done,doneEst,cap,left:cap==null?null:cap-est,blocked:all.filter(hasBlocker),missingEstimate:all.filter(t=>t.estimateHours==null)}}
function canPlan(t,wk){if(t.estimateHours==null)return {ok:false,why:'У задачи N/A в оценке объёма. Укажите часы перед планированием.'};if(t.priority==='NA')return {ok:false,why:'Приоритет N/A. Выберите P1 или P2.'};if(t.status==='inbox'||t.status==='backlog')return {ok:false,why:'Сначала переведите задачу в To Do через проверку готовности.'};if(!canMoveBoard(t))return {ok:false,why:'Нужно уточнить задачу и подтвердить срок или «без срока».'};if(wk===t.planWeek)return {ok:true};const used=data.tasks.filter(x=>x.projectId===t.projectId&&x.planWeek===wk&&x.id!==t.id).reduce((s,x)=>s+Number(x.estimateHours||0),0);const cap=getCapacity(wk,t.projectId);if(cap==null)return {ok:false,why:'Capacity N/A. Сначала установите доступные часы на выбранную неделю.'};return used+Number(t.estimateHours)>cap?{ok:false,why:`Capacity превышена: ${hours(used)} занято из ${hours(cap)}, задача требует ${hours(t.estimateHours)}. Переприоритизируйте план.`}:{ok:true}}
function canMoveBoard(t){return t.priority!=='NA'&&(Boolean(t.dueDate)||t.noDueConfirmed)&&!t.needsClarification}
function moveStatus(id,status){const t=data.tasks.find(t=>t.id===id);if(!t||t.status===status)return;if(['todo','doing','review','done'].includes(status)&&!canMoveBoard(t)){toast('Чтобы попасть на Board, уточните задачу, приоритет и срок (или явно подтвердите «без срока»).');openTask(id);return}const old=t.status;t.status=status;t.updatedAt=new Date().toISOString();if(status==='done'){t.completedAt=t.updatedAt}else if(old==='done')t.completedAt=null;log('Статус',t,`${STATUS[old]} → ${STATUS[status]}`);update()}
function newTaskFromText(raw){const text=clean(raw);if(!text){toast('Введите текст задачи');return}const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);const first=lines[0].slice(0,180);const t={id:uid(),title:first,context:text,rawInput:text,projectId:data.selectedProject,priority:'NA',status:'inbox',dueDate:null,noDueConfirmed:false,owner:'',estimateHours:null,actualHours:null,dependency:'',blocker:'',nextStep:'',link:'',needsClarification:true,planWeek:null,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),completedAt:null};data.tasks.unshift(t);log('Создана',t,'Быстрый ввод → Inbox. Неизвестные поля: N/A.');update();toast('В Inbox добавлена задача · нужно уточнить')}
function setProject(id){if(!data.projects.some(p=>p.id===id))return;data.selectedProject=id;weekAnchor=monday(today());calendarAnchor=today();ownerFilter='';update()}
function navLabels(){return {dashboard:'Обзор задач',inbox:'Inbox',backlog:'Backlog',today:'Сегодня',week:'Эта неделя',overdue:'Просрочено',review:'На проверке',board:'Kanban',calendar:'Календарь',weekly:'Недельный план',retrospective:'Еженедельный разбор',projects:'По проектам',owners:'По ответственным',journal:'История и решения'}}
function render(){if(!project())return;document.getElementById('projectSelect').innerHTML=data.projects.map(p=>`<option value="${esc(p.id)}" ${p.id===data.selectedProject?'selected':''}>● ${esc(p.name)}</option>`).join('');document.getElementById('headerView').textContent=navLabels()[view];document.querySelectorAll('[data-view]').forEach(el=>el.classList.toggle('active',el.dataset.view===view));document.getElementById('nav-inbox').textContent=scoped().filter(t=>t.status==='inbox').length;document.getElementById('nav-overdue').textContent=scoped().filter(t=>!isDone(t)&&t.dueDate&&t.dueDate<today()).length;const handlers={dashboard:renderDashboard,inbox:()=>renderTaskPage('inbox'),backlog:()=>renderTaskPage('backlog'),today:()=>renderTaskPage('today'),week:()=>renderTaskPage('week'),overdue:()=>renderTaskPage('overdue'),review:()=>renderTaskPage('review'),board:renderBoard,calendar:renderCalendar,weekly:renderWeekly,retrospective:renderRetro,projects:renderProjects,owners:renderOwners,journal:renderJournal};document.getElementById('content').innerHTML=handlers[view]();bindDrag()}
function pageHead(title,sub,actions=''){return `<div class="page-head"><div><h1>${title}</h1><p class="subtitle">${sub}</p></div>${actions}</div>`}
function stat(label,num,foot,dark=false){return `<div class="stat ${dark?'dark':''}"><div class="stat-label">${label}</div><div class="number">${num}</div><div class="foot">${foot}</div></div>`}
function weekControl(){return `<div class="tool-actions"><button class="btn sm" data-action="prev-week">‹</button><span class="datepill">${formatDate(weekAnchor)} — ${formatDate(weekEnd(weekAnchor),true)}</span><button class="btn sm" data-action="next-week">›</button><button class="btn sm" data-action="current-week">Текущая</button></div>`}
function empty(title='Пока здесь пусто',text='Добавьте задачу в Inbox, чтобы начать работу.',button=false){return `<div class="empty"><div class="empty-icon">↗</div><h3>${title}</h3><p>${text}</p>${button?'<button class="btn sm primary" data-action="new-task" style="margin-top:17px">＋ Добавить задачу</button>':''}</div>`}
function priorityChip(t){return `<span class="chip ${t.priority==='P1'?'p1':t.priority==='P2'?'p2':'muted'}">${esc(t.priority==='NA'?'N/A':t.priority)}</span>`}
function tags(t){return `${priorityChip(t)}${t.needsClarification?'<span class="chip warn">Нужно уточнить</span>':''}${hasBlocker(t)?'<span class="chip red">Блокер</span>':''}`}
function taskRow(t,options={}){return `<div class="task-row"><span class="dot ${t.status}"></span><div class="task-main"><div class="task-title">${esc(t.title)}</div><div class="task-meta">${tags(t)}<span>${esc(STATUS[t.status])}</span><span>·</span><span>Срок: ${formatDate(t.dueDate)}</span><span>·</span><span>${esc(n(t.owner))}</span>${t.planWeek?`<span>· план ${formatDate(t.planWeek)}</span>`:''}</div></div><div class="task-actions"><button class="pill-button" data-action="edit" data-id="${t.id}">Открыть</button>${options.plan&&t.planWeek!==weekAnchor?`<button class="pill-button" data-action="plan" data-id="${t.id}">В план</button>`:''}${options.pipeline&&t.status==='inbox'?`<button class="pill-button" data-action="to-backlog" data-id="${t.id}">В Backlog →</button>`:''}${options.pipeline&&t.status==='backlog'?`<button class="pill-button" data-action="to-todo" data-id="${t.id}">На Board →</button>`:''}${options.roll&&t.planWeek?`<button class="pill-button" data-action="roll" data-id="${t.id}">Перенести</button>`:''}</div></div>`}
function list(tasks,options={},lim=100){return tasks.length?`<div class="tasks">${tasks.slice(0,lim).map(t=>taskRow(t,options)).join('')}${tasks.length>lim?`<div class="note">Показаны первые ${lim} из ${tasks.length} задач.</div>`:''}</div>`:empty()}
function quickBox(){return `<div class="panel"><div class="panel-head"><div class="panel-title">Быстрый захват</div><span class="tag">Inbox first</span></div><div class="panel-body"><div class="quickbox"><textarea id="quickInput" placeholder="Например: После созвона с отделом продаж — сверить причины просадки конверсии и предложить следующий эксперимент…"></textarea><div class="tiny-row"><span class="hint">Проект: ${esc(project().name)} · неизвестное → N/A · нужно уточнить</span><button class="btn primary sm" data-action="capture">Добавить в Inbox ↗</button></div></div></div></div>`}
function renderDashboard(){const ts=scoped(),c=calc(),inbox=ts.filter(t=>t.status==='inbox'),overdue=ts.filter(t=>!isDone(t)&&t.dueDate&&t.dueDate<today()),pending=ts.filter(t=>t.status==='review'),f=ts.filter(t=>t.planWeek===weekAnchor&&!isDone(t));return `${pageHead('Хороший план начинается с ясности',`Ваш рабочий контур · ${esc(project().name)}`,`<span class="datepill">${new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'long'})}</span>`)}<div class="stats">${stat('Входящие',inbox.length,'Требуют разбора')}${stat('На этой неделе',c.all.length,`${c.done.length} завершено`)}${stat('Просрочено',overdue.length,'Нужны решения')}${stat('Нагрузка',`${hours(c.est)} / ${hours(c.cap)}`,'Занято на неделю',true)}</div><div class="grid2"><div>${quickBox()}<div class="panel" style="margin-top:18px"><div class="panel-head"><div class="panel-title">Фокус недели</div><button class="btn ghost sm" data-view="weekly">Открыть план ↗</button></div>${f.length?list(f,{roll:true},6):empty('План недели не сформирован','Разберите Inbox, задайте приоритеты и оценки, после чего добавьте задачи в недельный план.',true)}</div></div><div><div class="panel"><div class="panel-head"><span class="panel-title">Capacity / план-факт</span><span class="chip ${c.cap==null?'warn':c.est>c.cap?'red':'green'}">${c.cap==null?'Нужно уточнить':c.est>c.cap?'Перегруз':'Контроль'}</span></div><div class="panel-body"><div class="metricline"><span>Запланировано</span><strong>${hours(c.est)} / ${hours(c.cap)}</strong></div><div class="progress ${c.est>c.cap?'overflow':''}"><i style="width:${Math.min(100,c.cap?c.est/c.cap*100:0)}%"></i></div><div class="metricline"><span>Завершено по оценке</span><strong>${hours(c.doneEst)}</strong></div><div class="metricline"><span>Фактически затрачено</span><strong>${hours(c.actual)}</strong></div><div class="metricline"><span>Доступно для планирования</span><strong>${hours(c.left==null?null:Math.max(0,c.left))}</strong></div><button class="btn sm" data-view="retrospective" style="width:100%;margin-top:9px">Еженедельный разбор ↗</button></div></div><div class="panel" style="margin-top:18px"><div class="panel-head"><span class="panel-title">Требуют внимания</span></div><div class="panel-body"><div class="little-list"><div class="little-line"><span>⚠ Просроченные</span><strong>${overdue.length}</strong></div><div class="little-line"><span>◉ На проверке</span><strong>${pending.length}</strong></div><div class="little-line"><span>◷ Заблокированные</span><strong>${ts.filter(t=>hasBlocker(t)&&!isDone(t)).length}</strong></div><div class="little-line"><span>◇ Уточнить</span><strong>${ts.filter(t=>t.needsClarification).length}</strong></div></div></div></div></div></div>`}
function filteredTasks(type){let ts=scoped();switch(type){case'inbox':ts=ts.filter(t=>t.status==='inbox');break;case'backlog':ts=ts.filter(t=>t.status==='backlog');break;case'today':ts=ts.filter(t=>t.dueDate===today()||t.planWeek===weekAnchor&&t.status==='doing');break;case'week':ts=ts.filter(t=>t.planWeek===weekAnchor||dueInWeek(t,weekAnchor));break;case'overdue':ts=ts.filter(t=>!isDone(t)&&t.dueDate&&t.dueDate<today());break;case'review':ts=ts.filter(t=>t.status==='review');break}if(searchText)ts=ts.filter(t=>`${t.title} ${t.context} ${t.owner} ${t.nextStep}`.toLowerCase().includes(searchText.toLowerCase()));return ts.sort((a,b)=>sortMode==='deadline'?(a.dueDate||'9999').localeCompare(b.dueDate||'9999'):sortMode==='newest'?b.createdAt.localeCompare(a.createdAt):({P1:0,P2:1,NA:2}[a.priority]-{P1:0,P2:1,NA:2}[b.priority])||(a.dueDate||'9999').localeCompare(b.dueDate||'9999'))}
function renderTaskPage(type){const title={inbox:'Inbox',backlog:'Backlog',today:'Сегодня',week:'Эта неделя',overdue:'Просрочено',review:'На проверке'}[type],sub={inbox:'Собирайте всё без потери контекста. Сначала захват — потом структура.',backlog:'Уточняйте, оценивайте и расставляйте приоритеты перед планированием.',today:'Задачи со сроком сегодня и находящиеся в работе задачи плана.',week:'Задачи в недельном плане или со сроком в пределах недели.',overdue:'Открытые задачи, по которым срок уже прошёл.',review:'Задачи, ожидающие проверки и принятия результата.'}[type],ts=filteredTasks(type);return `${pageHead(title,sub)}<div class="toolbar"><div class="tool-actions"><input class="field search" id="searchInput" value="${esc(searchText)}" placeholder="Поиск по задачам…" /><select class="field" id="sortInput" style="width:160px"><option value="priority" ${sortMode==='priority'?'selected':''}>По приоритету</option><option value="deadline" ${sortMode==='deadline'?'selected':''}>По сроку</option><option value="newest" ${sortMode==='newest'?'selected':''}>Сначала новые</option></select></div><span class="datepill">${ts.length} задач</span></div>${type==='inbox'?`<div style="margin-bottom:17px">${quickBox()}</div>`:''}<div class="panel">${ts.length?list(ts,{plan:true,roll:true,pipeline:true}):empty('Нет задач в этом представлении',type==='inbox'?'Добавьте текст из чата или созвона, чтобы сохранить задачу с контекстом.':'Измените фильтр или добавьте новую задачу.',type==='inbox')}</div>`}
function card(t){return `<article class="task-card" draggable="true" data-task="${t.id}"><div class="tiny-row">${tags(t)}<button class="btn ghost sm" data-action="edit" data-id="${t.id}" aria-label="Открыть задачу">↗</button></div><h3>${esc(t.title)}</h3><div class="task-meta"><span>${formatDate(t.dueDate)}</span><span>· ${hours(t.estimateHours)}</span></div><div class="task-card-footer"><span class="chip">${esc(n(t.owner))}</span><select class="inline-select" data-action="status-select" data-id="${t.id}" aria-label="Изменить статус">${Object.entries(STATUS).map(([v,l])=>`<option value="${v}" ${v===t.status?'selected':''}>${l}</option>`).join('')}</select></div></article>`}
function renderBoard(){return `${pageHead('Kanban Board','Готовые задачи проходят путь To Do → In Progress → In Review → Done. Перетаскивайте карточки между колонками.')}<div class="toolbar"><div class="note">Перед помещением на Board обязательны приоритет, ясность задачи и срок либо подтверждённое «без срока».</div><button class="btn sm" data-view="backlog">Открыть Backlog</button></div><div class="board">${['todo','doing','review','done'].map(st=>`<section class="column" data-drop="${st}"><div class="colhead"><span>${STATUS[st]}</span><span class="colcount">${scoped().filter(t=>t.status===st).length}</span></div>${scoped().filter(t=>t.status===st).sort((a,b)=>({P1:0,P2:1,NA:2}[a.priority]-{P1:0,P2:1,NA:2}[b.priority])).map(card).join('')||'<div class="hint" style="padding:16px;text-align:center">Перетащите задачу сюда</div>'}</section>`).join('')}</div>`}
function renderCalendar(){const d=parseDate(calendarAnchor),first=new Date(d.getFullYear(),d.getMonth(),1,12),start=monday(dateISO(first));let cells='';const items=scoped().filter(t=>t.dueDate);for(let i=0;i<42;i++){const day=addDays(start,i),outside=parseDate(day).getMonth()!==d.getMonth(),todayClass=day===today(),dayTasks=items.filter(t=>t.dueDate===day);cells+=`<div class="cal-cell ${outside?'outside':''} ${todayClass?'today':''}" data-action="day" data-day="${day}"><span class="daynum">${Number(day.slice(8))}</span>${dayTasks.slice(0,3).map(t=>`<div class="cal-task ${t.priority==='P1'?'p1':''}" data-action="edit" data-id="${t.id}" title="${esc(t.title)}">${esc(t.title)}</div>`).join('')}${dayTasks.length>3?`<div class="hint">+${dayTasks.length-3} ещё</div>`:''}</div>`}return `${pageHead('Календарь','Сроки задач выбранного проекта. Нажмите день, чтобы создать задачу с этим сроком.')}<div class="toolbar"><div class="tool-actions"><button class="btn sm" data-action="prev-month">‹</button><strong style="min-width:160px;text-align:center;text-transform:capitalize">${monthLabel(calendarAnchor)}</strong><button class="btn sm" data-action="next-month">›</button><button class="btn sm" data-action="current-month">Сегодня</button></div><span class="hint">Отображается поле «Срок», не плановая неделя</span></div><div class="panel"><div class="calendar">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="cal-day-head">${x}</div>`).join('')}${cells}</div></div>`}
function weekStrip(){const w=weekAnchor;return `<div class="weekline">${Array.from({length:7},(_,i)=>{const date=addDays(w,i);return `<div class="week-day ${date===today()?'now':''}"><span class="label">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][i]}</span><strong>${Number(date.slice(8))}</strong><span class="label">${scoped().filter(t=>t.dueDate===date||t.planWeek===w&&t.status==='done'&&t.completedAt&&dateISO(new Date(t.completedAt))===date).length} событий</span></div>`}).join('')}</div>`}
function renderWeekly(){const c=calc(),unplanned=scoped().filter(t=>!t.planWeek&&!isDone(t)&&t.status!=='inbox'),usedPercent=c.cap==null?null:c.cap?Math.round(c.est/c.cap*100):c.est?999:0;return `${pageHead('Недельный план','Планируйте объём в часах, а не только количество задач. Capacity — отдельная для каждого проекта.',`<button class="btn primary" data-action="capacity">⚙ Capacity: ${hours(c.cap)}</button>`)}<div class="toolbar">${weekControl()}<div class="tool-actions"><button class="btn sm" data-action="freeze-plan">◇ Зафиксировать план</button><button class="btn sm" data-view="retrospective">Открыть разбор ↗</button></div></div><div class="stats">${stat('Занято',hours(c.est),`${usedPercent==null?'N/A':usedPercent+'%'} от capacity`)}${stat('Свободно',hours(c.left==null?null:Math.max(0,c.left)),c.left==null?'Capacity нужно уточнить':c.left<0?'Capacity превышена':'Можно планировать')}${stat('Завершено',`${c.done.length}/${c.all.length}`,`${hours(c.doneEst)} по оценке`)}${stat('Факт',hours(c.actual),'Фактически затрачено',true)}</div>${data.baselines[capacityKey()]?`<div class="note" style="margin-bottom:15px">План зафиксирован ${formatDateTime(data.baselines[capacityKey()].at)}: ${data.baselines[capacityKey()].tasks.length} задач / ${hours(data.baselines[capacityKey()].hours)}. Изменения после фиксации учитываются отдельно.</div>`:`<div class="note warn-note" style="margin-bottom:15px">План пока не зафиксирован. Для точного сравнения «план → факт» зафиксируйте исходные задачи недели перед началом работы.</div>`}${weekStrip()}<div class="grid2"><div class="panel"><div class="panel-head"><span class="panel-title">Запланированные задачи</span><span class="chip ${c.left<0?'red':'green'}">${c.all.length} в плане</span></div>${c.all.length?list(c.all.sort((a,b)=>(a.status==='done')-(b.status==='done')||({P1:0,P2:1,NA:2}[a.priority]-{P1:0,P2:1,NA:2}[b.priority])),{roll:true}):empty('Неделя без задач','Выберите готовые задачи из Backlog / To Do и добавьте в план.')}</div><div><div class="panel"><div class="panel-head"><span class="panel-title">Резерв и ограничение</span></div><div class="panel-body"><div class="metricline"><span>Загрузка</span><strong>${usedPercent==null?'N/A':usedPercent+'%'}</strong></div><div class="progress ${c.left<0?'overflow':''}"><i style="width:${Math.min(100,usedPercent??0)}%"></i></div><p style="font-size:12px;color:#758981;margin:16px 0">Для планирования нужны P1/P2, оценка объёма и готовность задачи. При превышении capacity добавление блокируется.</p><button class="btn sm" data-action="capacity">Изменить capacity</button></div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><span class="panel-title">Кандидаты в план</span></div>${unplanned.length?list(unplanned,{plan:true},7):empty('Нет подготовленных кандидатов','Сначала разберите входящие и подготовьте задачи к работе.')}</div></div></div>`}
function blockersForWeek(wk){const c=calc(wk),free=c.cap==null?null:c.cap-c.est;return scoped().filter(t=>!isDone(t)&&t.planWeek!==wk&&t.status!=='inbox').map(t=>{let why='';if(t.priority==='NA')why='Приоритет N/A';else if(t.estimateHours==null)why='Оценка N/A';else if(!canMoveBoard(t))why='Нужно уточнить / подтвердить срок';else if(c.cap==null)why='Capacity N/A';else if(t.estimateHours>free)why=`Недостаточно capacity (+${hours(t.estimateHours)}, доступно ${hours(Math.max(0,free))})`;return {t,why}}).filter(x=>x.why)}

function renderRetro(){const c=calc(),baseline=data.baselines[capacityKey()]||null,baseFinished=baseline?baseline.tasks.filter(x=>data.tasks.find(t=>t.id===x.id)?.status==='done'):[],movedEvents=data.events.filter(e=>e.projectId===data.selectedProject&&e.action==='Перенос'&&e.fromWeek===weekAnchor),unfinished=c.all.filter(t=>!isDone(t)),blockers=scoped().filter(t=>hasBlocker(t)&&!isDone(t)&&(t.planWeek===weekAnchor||dueInWeek(t,weekAnchor))),blockedCandidates=blockersForWeek(weekAnchor),completed=c.all.filter(isDone);return `${pageHead('Еженедельный разбор','План, факт, переносы, блокеры и ограничения следующего спринта.',`<button class="btn primary" data-action="telegram">↓ Telegram-сводка</button>`)}<div class="toolbar">${weekControl()}<button class="btn sm" data-action="decision-new">＋ Решение по неделе</button></div><div class="stats">${stat('План / завершено',`${c.all.length} / ${completed.length}`,'Количество задач')}${stat('Незавершено',unfinished.length,'Остались в плане')}${stat('Переносов',movedEvents.length,'В другую неделю с причиной')}${stat('Загрузка capacity',`${hours(c.est)} / ${hours(c.cap)}`,`${c.left==null?'Capacity N/A':c.left<0?'Перегруз':'Свободно: '+hours(c.left)}`,true)}</div>${baseline?`<div class="note" style="margin-bottom:15px"><strong>Зафиксированный план:</strong> ${baseline.tasks.length} задач / ${hours(baseline.hours)} · выполнено из исходного списка: ${baseFinished.length} / ${baseline.tasks.length} (${hours(baseFinished.reduce((a,t)=>a+Number(t.estimateHours||0),0))} по исходной оценке). Текущий план: ${c.all.length} задач / ${hours(c.est)}. Дата фиксации: ${formatDateTime(baseline.at)}.</div>`:`<div class="note warn-note" style="margin-bottom:15px">Исходный план не зафиксирован. Ниже показан только текущий состав недели; перенесённые задачи отражены отдельно и не входят в текущую сумму плана.</div>`}<div class="panel" style="margin-bottom:17px"><div class="panel-head"><span class="panel-title">План против факта</span><span class="tag">Сопоставление по трудозатратам</span></div><div class="panel-body"><div class="grid2"><div><div class="metricline"><span>План, оценка часов</span><strong>${hours(c.est)}</strong></div><div class="progress"><i style="width:${Math.min(100,c.cap?c.est/c.cap*100:0)}%"></i></div><div class="metricline"><span>Сделано, по оценке</span><strong>${hours(c.doneEst)}</strong></div><div class="progress"><i style="width:${Math.min(100,c.est?c.doneEst/c.est*100:0)}%"></i></div><div class="metricline"><span>Факт, записанные часы</span><strong>${hours(c.actual)}</strong></div></div><div class="note">Факт = сумма часов, внесённых вручную в карточки. «Сделано» = оценка завершённых задач. Если часы не записаны, 0 не означает отсутствие работы — проверьте полноту учёта.</div></div></div></div><div class="review-grid">${retroSection('✓ Завершено',completed,'Нет завершённых задач')}${retroSection('◷ Не завершено',unfinished,'Все задачи плана выполнены')}${retroSection('⊘ Заблокировано',blockers,'Нет открытых задач с блокером')}<div class="review-card"><h3>↗ Перенесено <span class="chip">${movedEvents.length}</span></h3><div class="inside">${movedEvents.length?movedEvents.map(e=>`<div class="audit"><span class="audit-icon">↗</span><div><div class="audit-title">${esc(taskTitle(e.taskId))}</div><div class="audit-desc">${esc(e.reason||'Причина N/A')}</div><div class="audit-time">${formatDateTime(e.at)} · ${esc(e.details)}</div></div></div>`).join(''):`<div class="empty" style="padding:27px 10px"><p>Переносов с этой недели нет</p></div>`}</div></div></div><div class="panel" style="margin-top:17px"><div class="panel-head"><span class="panel-title">Нельзя добавить без переприоритизации / уточнения</span><span class="chip ${blockedCandidates.length?'warn':'green'}">${blockedCandidates.length}</span></div>${blockedCandidates.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Кандидат</th><th>Оценка</th><th>Причина</th><th></th></tr></thead><tbody>${blockedCandidates.map(({t,why})=>`<tr><td><strong>${esc(t.title)}</strong></td><td>${hours(t.estimateHours)}</td><td><span class="chip warn">${esc(why)}</span></td><td><button class="pill-button" data-action="edit" data-id="${t.id}">Уточнить</button></td></tr>`).join('')}</tbody></table></div>`:empty('Нет блокирующих ограничений','Кандидаты могут добавляться при соблюдении capacity и правил готовности задачи.')}</div>`}
function renderProjects(){const items=data.projects;return `${pageHead('По проектам','Каждый проект имеет отдельный backlog, недельный capacity и историю. Переключение не смешивает задачи.',`<button class="btn primary" data-action="project-new">＋ Новый проект</button>`)}<div class="projects">${items.map(p=>{const ts=data.tasks.filter(t=>t.projectId===p.id),inc=ts.filter(t=>t.status==='inbox').length,w=ts.filter(t=>t.planWeek===weekAnchor).length;return `<article class="project-card" data-action="switch-project" data-id="${p.id}"><span class="color-dot" style="background:${p.color}"></span> <span class="chip ${p.id===data.selectedProject?'green':''}">${p.id===data.selectedProject?'Текущий проект':'Открыть проект ↗'}</span><h3>${esc(p.name)}</h3><p>${ts.length} задач · ${inc} в Inbox · ${w} в плане недели</p></article>`}).join('')}</div><div class="note" style="margin-top:17px">Проекты показываются отдельными карточками, а не объединяются в общий список или общий недельный план. Чтобы работать с задачами другого проекта, явно переключите проект сверху.</div>`}

function saveTask(){const form=document.getElementById('taskForm');if(!form)return;const raw=new FormData(form),id=form.dataset.id||null,old=data.tasks.find(t=>t.id===id),name=clean(raw.get('title'));if(!name){toast('Название задачи обязательно');return}const noDueConfirmed=raw.get('noDueConfirmed')==='on',needsClarification=raw.get('needsClarification')==='on',priority=raw.get('priority'),dueDate=clean(raw.get('dueDate'))||null,status=raw.get('status');const updated={title:name.slice(0,200),context:clean(raw.get('context')),projectId:raw.get('projectId'),status,priority,dueDate,noDueConfirmed,needsClarification,owner:clean(raw.get('owner')),estimateHours:clean(raw.get('estimateHours'))===''?null:Number(raw.get('estimateHours')),actualHours:clean(raw.get('actualHours'))===''?null:Number(raw.get('actualHours')),dependency:clean(raw.get('dependency')),blocker:clean(raw.get('blocker')),nextStep:clean(raw.get('nextStep')),link:clean(raw.get('link'))};if(!data.projects.some(p=>p.id===updated.projectId)){toast('Укажите существующий проект');return}if(['todo','doing','review','done'].includes(status)&&(priority==='NA'||needsClarification||(!dueDate&&!noDueConfirmed))){toast('Для Board: определите приоритет, уточните задачу и задайте срок / отметьте без срока.');return}if(old&&old.planWeek&&old.projectId!==updated.projectId){toast('Чтобы сменить проект, сначала уберите задачу из недельного плана (Перенести → снять с плана).');return}if(old&&old.planWeek&&updated.estimateHours!=null){const used=data.tasks.filter(t=>t.id!==old.id&&t.projectId===old.projectId&&t.planWeek===old.planWeek).reduce((s,t)=>s+Number(t.estimateHours||0),0);if(used+updated.estimateHours>getCapacity(old.planWeek,old.projectId)){toast('Оценка превышает capacity. Сначала переприоритизируйте недельный план.');return}}const t=old||{id:uid(),createdAt:new Date().toISOString(),rawInput:'',completedAt:null,planWeek:null};const changes=old?Object.keys(updated).filter(k=>JSON.stringify(t[k])!==JSON.stringify(updated[k])):[];const oldFields={...t};const wasDone=t.status==='done';Object.assign(t,updated,{updatedAt:new Date().toISOString()});if(status==='done'&&!wasDone)t.completedAt=t.updatedAt;if(status!=='done')t.completedAt=null;if(!old){data.tasks.unshift(t);log('Создана',t,'Создана вручную')}else if(changes.length)log('Изменена',t,changes.map(x=>{const label=({title:'Задача',context:'Контекст',projectId:'Проект',status:'Статус',priority:'Приоритет',dueDate:'Срок',owner:'Ответственный',estimateHours:'Оценка',actualHours:'Факт',dependency:'Зависимость',blocker:'Блокер',nextStep:'Следующий шаг',link:'Ссылка',noDueConfirmed:'Без срока',needsClarification:'Нужно уточнить'}[x]||x);const oldVal=String(oldFields[x]??'N/A').slice(0,85),newVal=String(t[x]??'N/A').slice(0,85);return `${label}: ${oldVal} → ${newVal}`}).join('\n'));closeModal();update();toast('Задача сохранена')}
function freezePlan(){if(getCapacity()==null){toast('Для фиксации плана сначала укажите capacity недели.');openCapacity();return}const key=capacityKey(),tasks=planTasks().map(t=>({id:t.id,title:t.title,estimateHours:t.estimateHours,priority:t.priority}));if(data.baselines[key]&&!confirm('Исходный план уже зафиксирован. Перезаписать его текущим составом?'))return;data.baselines[key]={at:new Date().toISOString(),tasks,hours:tasks.reduce((a,t)=>a+Number(t.estimateHours||0),0),capacity:getCapacity()};data.events.unshift({id:uid(),at:new Date().toISOString(),projectId:data.selectedProject,taskId:null,action:'Фиксация плана',details:`${tasks.length} задач, ${hours(data.baselines[key].hours)}`});update();toast('Исходный план недели зафиксирован')}
function openCapacity(){const c=getCapacity();modalFrame('Capacity на неделю',`<div class="note" style="margin-bottom:16px">${esc(project().name)} · ${formatDate(weekAnchor)} — ${formatDate(weekEnd(weekAnchor))}. Лимит задаётся отдельно для каждого проекта и каждой недели. Исходное значение N/A: задайте реальную доступность в часах.</div><form id="capacityForm">${group('Плановая доступность, часов',textInput('hours',c,'N/A','number','min="0" step="0.5"'))}<p class="hint">Сейчас занято ${hours(calc().est)}. Уменьшение лимита ниже занятого объёма потребует переприоритизации.</p></form>`,`<button class="btn" data-action="close">Отмена</button><button class="btn primary" data-action="save-capacity">Сохранить</button>`,true)}
function saveCapacity(){const raw=new FormData(document.getElementById('capacityForm')).get('hours');if(clean(raw)===''){toast('Capacity не указана — установите значение в часах');return}const val=Number(raw);if(!Number.isFinite(val)||val<0){toast('Введите корректное количество часов');return}data.capacity[capacityKey()]=val;data.events.unshift({id:uid(),at:new Date().toISOString(),projectId:data.selectedProject,taskId:null,action:'Capacity',details:`Неделя ${weekAnchor}: ${hours(val)}`});closeModal();update();toast('Capacity обновлена')}
function openPlan(id){const t=data.tasks.find(x=>x.id===id);if(!t)return;const choice=canPlan(t,weekAnchor);if(!choice.ok){toast(choice.why);if(choice.why.includes('N/A')||choice.why.includes('To Do'))openTask(id);return}t.planWeek=weekAnchor;t.updatedAt=new Date().toISOString();log('План',t,`Добавлена в неделю ${formatDate(weekAnchor)} · ${hours(t.estimateHours)}`);update();toast('Задача добавлена в план')}
function openRoll(id){const t=data.tasks.find(x=>x.id===id);if(!t)return;if(!t.planWeek){toast('Задача ещё не в недельном плане');return}const body=`<form id="rollForm" data-id="${id}">${group('Новая неделя (любой день недели)',textInput('nextWeek',addDays(t.planWeek,7),'','date'))}<div class="form-check" style="margin:13px 0 16px"><input type="checkbox" id="removeFromPlan" name="removeFromPlan"/><label for="removeFromPlan">Снять с недельного плана (в Backlog / без новой даты)</label></div>${group('Причина переноса *',selectInput('reason',[['','Выберите причину'],['Изменился приоритет','Изменился приоритет'],['Не хватило capacity','Не хватило capacity'],['Зависимость / ожидание','Зависимость / ожидание'],['Блокер','Блокер'],['Недооценка объёма','Недооценка объёма'],['Внешнее изменение','Внешнее изменение'],['Другое','Другое']],'') )}<div style="height:14px"></div>${group('Комментарий',textareaInput('details','','Что произошло и какое решение принято'))}</form>`;modalFrame('Перенести задачу',body,`<button class="btn" data-action="close">Отмена</button><button class="btn primary" data-action="save-roll">Зафиксировать перенос</button>`,true)}
function saveRoll(){const f=document.getElementById('rollForm');const raw=new FormData(f),t=data.tasks.find(x=>x.id===f.dataset.id),reason=clean(raw.get('reason')),comment=clean(raw.get('details')),remove=raw.get('removeFromPlan')==='on',next=remove?null:monday(clean(raw.get('nextWeek')));if(!t||!reason){toast('Укажите причину переноса');return}if(!remove&&!next){toast('Укажите новую неделю');return}if(next===t.planWeek){toast('Выберите другую неделю');return}if(next){const check=canPlan(t,next);if(!check.ok){toast(check.why);return}}const from=t.planWeek;t.planWeek=next;t.updatedAt=new Date().toISOString();log('Перенос',t,`${formatDate(from)} → ${next?formatDate(next):'снят с плана'}`,`${reason}${comment?' — '+comment:''}`);data.events[0].fromWeek=from;data.events[0].toWeek=next;closeModal();update();toast('Перенос и причина записаны')}
function openProject(){modalFrame('Новый проект',`<form id="projectForm">${group('Название проекта *',textInput('name','','Например: Новый клиент'))}<div style="height:15px"></div>${group('Цвет проекта',selectInput('color',COLORS.map((x,i)=>[x,['Изумрудный','Синий','Терракота','Фиолетовый','Золотой','Графитовый'][i]]),COLORS[(data.projects.length)%COLORS.length]))}</form>`,`<button class="btn" data-action="close">Отмена</button><button class="btn primary" data-action="save-project">Создать проект</button>`,true)}
function saveProject(){const f=new FormData(document.getElementById('projectForm')),name=clean(f.get('name'));if(!name){toast('Введите название проекта');return}if(data.projects.some(p=>p.name.toLowerCase()===name.toLowerCase())){toast('Проект с таким названием уже существует');return}const id=uid();data.projects.push({id,name,color:f.get('color'),createdAt:new Date().toISOString()});data.selectedProject=id;closeModal();setView('dashboard');toast('Создан отдельный проект')}
function openDecision(){modalFrame('Зафиксировать решение',`<form id="decisionForm">${group('Суть решения *',textInput('title','','Например: Перенесли запуск на следующую неделю'))}<div style="height:16px"></div>${group('Основание / контекст',textareaInput('details','','Почему, кто решил, что делаем дальше'))}<div class="form-check"><input type="checkbox" id="decisionWeek" name="decisionWeek" checked/><label for="decisionWeek">Привязать к неделе ${formatDate(weekAnchor)}</label></div></form>`,`<button class="btn" data-action="close">Отмена</button><button class="btn primary" data-action="save-decision">Сохранить решение</button>`,true)}
function saveDecision(){const raw=new FormData(document.getElementById('decisionForm')),title=clean(raw.get('title'));if(!title){toast('Введите суть решения');return}data.decisions.unshift({id:uid(),projectId:data.selectedProject,at:new Date().toISOString(),title,details:clean(raw.get('details')),week:raw.get('decisionWeek')==='on'?weekAnchor:null});closeModal();update();toast('Решение сохранено')}
function deleteTask(id){const t=data.tasks.find(x=>x.id===id);if(!t||!confirm(`Удалить задачу «${t.title}»? Отменить это действие нельзя.`))return;log('Удалена',t,'Задача удалена из базы. Событие сохранено в журнале.');data.tasks=data.tasks.filter(x=>x.id!==id);closeModal();update();toast('Задача удалена')}
function telegramText(){const c=calc(),w=weekAnchor,ms=data.events.filter(e=>e.projectId===data.selectedProject&&e.action==='Перенос'&&e.fromWeek===w),left=c.all.filter(t=>!isDone(t)),blocked=c.all.filter(t=>hasBlocker(t)&&!isDone(t)),limits=blockersForWeek(w),decisions=data.decisions.filter(d=>d.projectId===data.selectedProject&&d.week===w);const b=data.baselines[capacityKey()]||null;const lines=[`📋 ${project().name} · неделя ${formatDate(w)}–${formatDate(weekEnd(w),true)}`,b?`Исходный план: ${b.tasks.length} задач / ${hours(b.hours)} · завершено из него ${b.tasks.filter(x=>data.tasks.find(t=>t.id===x.id)?.status==='done').length}`:'Исходный план: не зафиксирован',`План / факт: ${c.all.length} задач / ${c.done.length} готово`,`Объём: ${hours(c.est)} план · ${hours(c.doneEst)} завершено по оценке · ${hours(c.actual)} факт`,`Capacity: ${hours(c.est)} из ${hours(c.cap)} (${c.left==null?'capacity N/A':c.left>=0?'резерв '+hours(c.left):'перегруз '+hours(-c.left)})`,'',`✅ Сделано (${c.done.length}):`,...(c.done.length?c.done.map(t=>`• ${t.title}`):['• —']),'',`⏳ Не сделано (${left.length}):`,...(left.length?left.map(t=>`• ${t.title}${t.nextStep?' — '+t.nextStep:''}`):['• —']),'',`↗ Переносы (${ms.length}):`,...(ms.length?ms.map(e=>`• ${taskTitle(e.taskId)} — ${e.reason||'N/A'}`):['• —']),'',`⛔ Блокеры (${blocked.length}):`,...(blocked.length?blocked.map(t=>`• ${t.title}: ${t.blocker}`):['• —']),'',`🚫 В план без уточнения / переприоритизации: ${limits.length}`,...(limits.length?limits.slice(0,6).map(({t,why})=>`• ${t.title}: ${why}`):['• —']),'',`💡 Решения (${decisions.length}):`,...(decisions.length?decisions.map(x=>`• ${x.title}`):['• —'])];return lines.join('\n')}
function openTelegram(){modalFrame('Сводка для Telegram',`<p class="subtitle" style="margin-bottom:12px">Только проект ${esc(project().name)} и неделя ${formatDate(weekAnchor)} — ${formatDate(weekEnd(weekAnchor))}. Можно скопировать или сохранить .txt.</p><textarea class="field copy-text" id="tgText" readonly>${esc(telegramText())}</textarea>`,`<button class="btn" data-action="download-txt">↓ .txt</button><button class="btn primary" data-action="copy-tg">Скопировать текст</button>`,true)}
function downloadFile(name,content,type='text/plain;charset=utf-8'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backup(){downloadFile(`flow-backup-${today()}.json`,JSON.stringify(data,null,2),'application/json');toast('JSON-резервная копия скачана')}
async function restoreFromFile(file){if(!file)return;try{const raw=await file.text(),value=JSON.parse(raw);if(!value||!Array.isArray(value.tasks)||!Array.isArray(value.projects)||!value.projects.length||!Array.isArray(value.events??[]))throw Error('Неверный формат');if(!confirm(`Импортировать ${value.tasks.length} задач и ${value.projects.length} проектов? Текущие локальные данные будут заменены.`))return;data={...initial(),...value,events:value.events||[],decisions:value.decisions||[],capacity:value.capacity||{},baselines:value.baselines||{}};if(!data.projects.some(p=>p.id===data.selectedProject))data.selectedProject=data.projects[0].id;view='dashboard';update();toast('Данные импортированы')}catch(e){toast('Файл не распознан. Используйте JSON-экспорт этого приложения.')}finally{document.getElementById('importFile').value=''}}
function bindDrag(){let id=null;document.querySelectorAll('.task-card[draggable]').forEach(el=>{el.addEventListener('dragstart',e=>{id=el.dataset.task;e.dataTransfer.setData('text/plain',id);e.dataTransfer.effectAllowed='move';el.classList.add('dragging')});el.addEventListener('dragend',()=>{el.classList.remove('dragging');document.querySelectorAll('.column').forEach(x=>x.classList.remove('drop'))})});document.querySelectorAll('[data-drop]').forEach(el=>{el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drop')});el.addEventListener('dragleave',e=>{if(!el.contains(e.relatedTarget))el.classList.remove('drop')});el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('drop');moveStatus(e.dataTransfer.getData('text/plain')||id,el.dataset.drop)})})}
const actions={menu:()=>document.getElementById('sidebar').classList.toggle('open'),'new-task':()=>openTask(),capture:()=>{const el=document.getElementById('quickInput');if(el)newTaskFromText(el.value)},edit:(el)=>openTask(el.dataset.id),'delete-task':el=>deleteTask(el.dataset.id),'save-task':saveTask,close:closeModal,'close-outside':e=>{if(e.target.classList.contains('modal-backdrop'))closeModal()},plan:el=>openPlan(el.dataset.id),roll:el=>openRoll(el.dataset.id),'save-roll':saveRoll,capacity:openCapacity,'save-capacity':saveCapacity,'freeze-plan':freezePlan,'to-backlog':el=>moveStatus(el.dataset.id,'backlog'),'to-todo':el=>moveStatus(el.dataset.id,'todo'),'project-new':openProject,'save-project':saveProject,'switch-project':el=>{setProject(el.dataset.id);setView('dashboard')},'decision-new':openDecision,'save-decision':saveDecision,telegram:openTelegram,'copy-tg':async()=>{const t=document.getElementById('tgText');try{await navigator.clipboard.writeText(t.value);toast('Сводка скопирована')}catch(e){t.select();document.execCommand('copy');toast('Текст выделен для копирования')}},'download-txt':()=>{downloadFile(`flow-telegram-${data.selectedProject}-${weekAnchor}.txt`,telegramText());toast('Сводка сохранена')},'export-json':backup,'import-json':()=>document.getElementById('importFile').click(),'prev-week':()=>{weekAnchor=addDays(weekAnchor,-7);render()},'next-week':()=>{weekAnchor=addDays(weekAnchor,7);render()},'current-week':()=>{weekAnchor=monday(today());render()},'prev-month':()=>{const d=parseDate(calendarAnchor);d.setMonth(d.getMonth()-1,1);calendarAnchor=dateISO(d);render()},'next-month':()=>{const d=parseDate(calendarAnchor);d.setMonth(d.getMonth()+1,1);calendarAnchor=dateISO(d);render()},'current-month':()=>{calendarAnchor=today();render()},day:el=>openTask(null,{dueDate:el.dataset.day})};
document.addEventListener('click',e=>{const v=e.target.closest('[data-view]');if(v){setView(v.dataset.view);return}const a=e.target.closest('[data-action]');if(a&&actions[a.dataset.action]){if(a.dataset.action==='close-outside'&&e.target!==a)return;actions[a.dataset.action](a,e)}});
document.addEventListener('change',e=>{if(e.target.id==='projectSelect')setProject(e.target.value);if(e.target.id==='sortInput'){sortMode=e.target.value;render()}if(e.target.dataset.action==='status-select')moveStatus(e.target.dataset.id,e.target.value);if(e.target.id==='searchInput'){searchText=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();return}if((e.key==='n'||e.key==='N')&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){e.preventDefault();openTask()}if(e.key==='Enter'&&e.target.id==='quickInput'&&(e.ctrlKey||e.metaKey)){e.preventDefault();newTaskFromText(e.target.value)}});
document.getElementById('importFile').addEventListener('change',e=>restoreFromFile(e.target.files[0]));
render();
</script>
</body>
